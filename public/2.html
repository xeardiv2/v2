<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canales Deportivos IPTV - Plyr & hls.js</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-title i { font-size: 1.8rem; color: #38bdf8; }
        .logo-title h1 { font-size: 1.4rem; font-weight: 700; }

        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            border: none;
            font-size: 0.9rem;
        }

        .btn:hover { background-color: var(--accent-hover); }
        input[type="file"] { display: none; }

        .container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; }
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-wrapper {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16/9;
            position: relative;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        .channel-info {
            background-color: var(--card-bg);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .channel-details h2 { font-size: 1.2rem; margin-bottom: 0.3rem; }

        .channel-url {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            margin-top: 0.4rem;
        }

        .playlist-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            overflow: hidden;
        }

        .search-box { padding: 1rem; border-bottom: 1px solid var(--border-color); }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .channel-list { list-style: none; overflow-y: auto; flex: 1; }

        .channel-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .channel-item:hover { background-color: rgba(255, 255, 255, 0.05); }

        .channel-item.active {
            background-color: rgba(37, 99, 235, 0.2);
            border-left: 4px solid var(--accent-color);
        }

        .channel-item-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
        }

        .channel-logo {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background-color: #0f172a;
            object-fit: contain;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .play-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .channel-item:hover .play-btn, .channel-item.active .play-btn {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <i class="fa-solid fa-trophy"></i>
            <h1>Canales Deportivos IPTV</h1>
        </div>
        <div>
            <label for="m3u-file" class="btn">
                <i class="fa-solid fa-folder-open"></i> Cargar BD.m3u
            </label>
            <input type="file" id="m3u-file" accept=".m3u,.m3u8">
        </div>
    </header>

    <div class="container">
        <!-- Reproductor de Video -->
        <div class="player-section">
            <div class="video-wrapper">
                <video id="player" controls playsinline></video>
            </div>
            <div class="channel-info">
                <div class="channel-details">
                    <span class="badge" id="current-group">Deportes</span>
                    <h2 id="current-title" style="margin-top: 0.3rem;">Seleccione un canal</h2>
                    <div class="channel-url" id="current-url">Fuente / Stream M3U8</div>
                </div>
            </div>
        </div>

        <!-- Lista de Canales -->
        <div class="playlist-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar canal...">
            </div>
            <ul class="channel-list" id="channel-list"></ul>
        </div>
    </div>

    <!-- Carga de Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        // Canales deportivos base con IDs únicos
        let channels = [
            { id: 0, name: "ESPN Argentina", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 1, name: "ESPN 2", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 2, name: "ESPN 3", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 3, name: "ESPN Premium", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 4, name: "TyC Sports", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 5, name: "Fox Sports", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 6, name: "TNT Sports", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" },
            { id: 7, name: "DSports (DirecTV Sports)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", logo: "", group: "Deportes" }
        ];

        const videoElem = document.getElementById('player');
        let hlsPlayer = null;
        let plyrInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            plyrInstance = new Plyr(videoElem, { 
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] 
            });
            renderChannels(channels);
            if (channels.length > 0) playChannelById(0);
        });

        function playChannelById(id) {
            const channel = channels.find(c => c.id === id);
            if (!channel) return;

            document.getElementById('current-title').textContent = channel.name;
            document.getElementById('current-url').textContent = channel.url;
            document.getElementById('current-group').textContent = channel.group || 'Deportes';

            document.querySelectorAll('.channel-item').forEach((el) => {
                el.classList.toggle('active', parseInt(el.dataset.id, 10) === id);
            });

            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(videoElem);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElem.play().catch(() => {});
                });
            } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                videoElem.src = channel.url;
                videoElem.play().catch(() => {});
            }
        }

        function renderChannels(list) {
            const container = document.getElementById('channel-list');
            container.innerHTML = '';
            list.forEach((channel) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.dataset.id = channel.id;
                li.onclick = () => playChannelById(channel.id);
                li.innerHTML = `
                    <div class="channel-item-info">
                        <div class="channel-logo"><i class="fa-solid fa-tv"></i></div>
                        <span class="channel-name">${escapeHtml(channel.name)}</span>
                    </div>
                    <button class="play-btn"><i class="fa-solid fa-play"></i> Ver inline</button>
                `;
                container.appendChild(li);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m]));
        }

        // Búsqueda en tiempo real corregida
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            renderChannels(channels.filter(c => c.name.toLowerCase().includes(query)));
        });

        // Parser automático para archivos M3U/M3U8
        document.getElementById('m3u-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split(/\r?\n/);
                const parsed = [];
                let current = null;

                lines.forEach((line) => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const name = line.substring(line.lastIndexOf(',') + 1).trim() || 'Canal';
                        current = { id: parsed.length, name: name, group: 'M3U Importado' };
                    } else if (line.length > 0 && !line.startsWith('#')) {
                        if (current) {
                            current.url = line;
                            parsed.push(current);
                            current = null;
                        }
                    }
                });

                if (parsed.length > 0) {
                    channels = parsed;
                    renderChannels(channels);
                    playChannelById(channels[0].id);
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
