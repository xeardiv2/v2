 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Deportiva Completa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e17; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a1f2e, #0d1117); border-radius: 16px; padding: 30px 40px; margin-bottom: 30px; border: 1px solid #2a2f3e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 28px; background: linear-gradient(90deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-info { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .badge { background: #1a2a3a; padding: 8px 16px; border-radius: 20px; font-size: 14px; border: 1px solid #2a4a5a; }
        .badge .numero { color: #00d4ff; font-weight: bold; font-size: 18px; }
        .btn-actualizar { background: linear-gradient(135deg, #00d4ff, #7b2ffc); border: none; color: white; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s; }
        .btn-actualizar:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
        .btn-actualizar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .controles { background: #111827; border-radius: 12px; padding: 20px 30px; margin-bottom: 25px; border: 1px solid #1f2937; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .controles label { font-size: 14px; color: #9ca3af; }
        .controles input { flex: 1; min-width: 250px; background: #1a2332; border: 1px solid #2a3a4a; color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; }
        .controles input:focus { outline: none; border-color: #00d4ff; }
        .controles .btn-pequeno { background: #1a2a3a; border: 1px solid #2a4a5a; color: white; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .controles .btn-pequeno:hover { background: #2a3a4a; }
        .loading { text-align: center; padding: 80px 20px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #1a2a3a; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .grid-partidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .partido-card { background: linear-gradient(145deg, #141b2b, #0d1220); border-radius: 16px; padding: 20px; border: 1px solid #1f2a3a; transition: all 0.3s; position: relative; overflow: hidden; animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        .partido-card:hover { transform: translateY(-4px); border-color: #2a4a6a; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5); }
        .partido-card .id-badge { position: absolute; top: 12px; right: 12px; background: #1a2a3a; color: #6a8aaa; font-size: 11px; padding: 3px 10px; border-radius: 12px; }
        .equipos { display: flex; align-items: center; justify-content: space-between; margin: 15px 0 10px; }
        .equipo { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
        .equipo img { width: 55px; height: 55px; object-fit: contain; border-radius: 50%; background: #0a0e17; padding: 5px; border: 2px solid #1f2a3a; }
        .equipo .nombre { font-size: 14px; font-weight: 600; text-align: center; color: #e0e0e0; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vs { color: #4a6a8a; font-weight: bold; font-size: 14px; padding: 0 10px; }
        .info-partido { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid #1a2a3a; }
        .hora { display: flex; align-items: center; gap: 8px; color: #9ca3af; font-size: 14px; }
        .btn-ver { background: linear-gradient(135deg, #00d4ff, #7b2ffc); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.3s; display: inline-block; }
        .btn-ver:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
        .btn-ver.sin-enlace { background: #1a2a3a; cursor: not-allowed; opacity: 0.5; }
        .sin-datos { text-align: center; padding: 60px 20px; color: #6a8aaa; }
        .json-raw { margin-top: 40px; background: #0a0e17; border-radius: 12px; border: 1px solid #1a2a3a; overflow: hidden; }
        .json-raw .toggle { background: #111827; padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a2a3a; font-size: 14px; color: #9ca3af; }
        .json-raw pre { padding: 20px; overflow-x: auto; font-size: 12px; line-height: 1.6; max-height: 400px; overflow-y: auto; display: none; }
        .json-raw pre.mostrar { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .footer { margin-top: 40px; text-align: center; color: #3a4a5a; font-size: 13px; padding: 20px; border-top: 1px solid #1a2a3a; }
        .footer a { color: #6a8aaa; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>âš½ Cartelera Deportiva</h1>
            <div class="header-info">
                <span class="badge">ðŸ“… <span id="fechaActual">-</span></span>
                <span class="badge">ðŸŸï¸ <span class="numero" id="totalPartidos">0</span> partidos</span>
                <button class="btn-actualizar" id="btnActualizar" onclick="cargarDatos()">ðŸ”„ Actualizar</button>
            </div>
        </header>

        <div class="controles">
            <label for="urlWorker">ðŸŒ URL del Worker:</label>
            <input type="url" id="urlWorker" placeholder="https://tu-worker.workers.dev/" value="https://tu-worker.workers.dev/">
            <button class="btn-pequeno" onclick="cargarDatos()">ðŸ“¥ Cargar</button>
            <button class="btn-pequeno" onclick="usarEjemplo()">ðŸ“‹ Ejemplo</button>
            <button class="btn-pequeno" onclick="toggleJSON()">ðŸ“„ Ver JSON</button>
        </div>

        <div id="contenedorPartidos">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando cartelera...</p>
            </div>
        </div>

        <div class="json-raw" id="jsonRaw">
            <div class="toggle" onclick="toggleJSON()">
                <span>ðŸ“„ Datos en JSON</span>
                <span id="toggleIcon">â–¶</span>
            </div>
            <pre id="jsonContent"></pre>
        </div>

        <footer class="footer">
            Datos obtenidos de <a href="https://www.thekotb.com/" target="_blank">thekotb.com</a> Â· Actualizado automÃ¡ticamente
        </footer>
    </div>

    <script>
        let datosActuales = null;
        let intervaloAuto = null;

        const SVG_FALLBACK = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%231a2a3a" width="100" height="100"/%3E%3Ctext x="50" y="55" text-anchor="middle" fill="%234a6a8a" font-size="30" font-family="Arial"%3Eâš½%3C/text%3E%3C/svg%3E';

        function extraerPartidos(data) {
            if (Array.isArray(data)) return data;
            if (data.cartelera && Array.isArray(data.cartelera)) return data.cartelera;
            if (data.partidos && Array.isArray(data.partidos)) return data.partidos;
            if (data.data && Array.isArray(data.data)) return data.data;
            return [];
        }

        async function cargarDatos() {
            const btn = document.getElementById('btnActualizar');
            const contenedor = document.getElementById('contenedorPartidos');
            const urlWorker = document.getElementById('urlWorker').value.trim();

            if (!urlWorker) {
                alert('Por favor, ingresa la URL de tu Worker');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'â³ Cargando...';
            contenedor.innerHTML = `<div class="loading"><div class="spinner"></div><p>Obteniendo datos de la cartelera...</p></div>`;

            try {
                const response = await fetch(urlWorker, { method: 'GET', headers: { 'Accept': 'application/json' } });
                if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

                const data = await response.json();
                if (data.error) throw new Error(data.mensaje || 'Error devuelto por la API');

                datosActuales = data;
                const partidos = extraerPartidos(data);

                renderizarPartidos(partidos);
                actualizarStats(data, partidos.length);
                mostrarJSON(data);
            } catch (error) {
                console.error('Error:', error);
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">âŒ</div>
                        <h2>Error al cargar los datos</h2>
                        <p style="margin-top:10px;color:#6a8aaa;">${error.message}</p>
                        <button class="btn-actualizar" style="margin-top:20px;" onclick="cargarDatos()">ðŸ”„ Reintentar</button>
                    </div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'ðŸ”„ Actualizar';
            }
        }

        function renderizarPartidos(partidos) {
            const contenedor = document.getElementById('contenedorPartidos');

            if (!partidos || partidos.length === 0) {
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">ðŸŸï¸</div>
                        <h2>No hay partidos disponibles</h2>
                        <p style="color:#6a8aaa;">No se encontraron eventos en la cartelera actual.</p>
                    </div>`;
                return;
            }

            let html = '<div class="grid-partidos">';
            partidos.forEach((p, index) => {
                const local = p.equipoLocal || p.home || p.local || 'Local';
                const visita = p.equipoVisita || p.away || p.visita || 'Visita';
                const hora = p.hora || p.time || p.horario || 'Por confirmar';
                const link = p.urlServidor || p.url || p.link || null;
                const tieneEnlace = link && link !== 'null' && link !== '#';

                const logoLocal = p.logoLocal || p.homeLogo || SVG_FALLBACK;
                const logoVisita = p.logoVisita || p.awayLogo || SVG_FALLBACK;

                html += `
                    <div class="partido-card" style="animation-delay: ${Math.min(index * 0.03, 0.6)}s">
                        <span class="id-badge">#${p.id || index + 1}</span>
                        <div class="equipos">
                            <div class="equipo">
                                <img src="${logoLocal}" alt="${local}" onerror="this.src='${SVG_FALLBACK}'">
                                <span class="nombre">${local}</span>
                            </div>
                            <div class="vs">VS</div>
                            <div class="equipo">
                                <img src="${logoVisita}" alt="${visita}" onerror="this.src='${SVG_FALLBACK}'">
                                <span class="nombre">${visita}</span>
                            </div>
                        </div>
                        <div class="info-partido">
                            <div class="hora"><span>ðŸ•</span> ${hora}</div>
                            ${tieneEnlace 
                                ? `<a href="${link}" target="_blank" rel="noopener" class="btn-ver">â–¶ Ver partido</a>`
                                : `<span class="btn-ver sin-enlace">ðŸ”’ Sin enlace</span>`}
                        </div>
                    </div>`;
            });
            html += '</div>';
            contenedor.innerHTML = html;
        }

        function actualizarStats(data, total) {
            document.getElementById('totalPartidos').textContent = total;
            const fechaRaw = data.metadata?.fechaExtraccion || data.timestamp || Date.now();
            const fecha = new Date(fechaRaw);
            document.getElementById('fechaActual').textContent = fecha.toLocaleString('es-ES', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function mostrarJSON(data) {
            document.getElementById('jsonContent').textContent = JSON.stringify(data, null, 2);
        }

        function toggleJSON() {
            const pre = document.getElementById('jsonContent');
            const icon = document.getElementById('toggleIcon');
            const visible = pre.classList.toggle('mostrar');
            icon.textContent = visible ? 'â–¼' : 'â–¶';
        }

        function usarEjemplo() {
            document.getElementById('urlWorker').value = 'https://tu-worker.workers.dev/?url=https://www.thekotb.com/';
            cargarDatos();
        }

        function iniciarAutoActualizacion() {
            if (intervaloAuto) clearInterval(intervaloAuto);
            intervaloAuto = setInterval(() => {
                if (document.getElementById('urlWorker').value.trim()) cargarDatos();
            }, 60000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlGuardada = localStorage.getItem('workerUrl');
            if (urlGuardada) document.getElementById('urlWorker').value = urlGuardada;

            document.getElementById('urlWorker').addEventListener('change', function() {
                localStorage.setItem('workerUrl', this.value);
            });

            cargarDatos();
            iniciarAutoActualizacion();
        });
    </script>
</body>
</html>
