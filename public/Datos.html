 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Deportiva - thekotb.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1f2e, #0d1117);
            border-radius: 16px;
            padding: 30px 40px;
            margin-bottom: 30px;
            border: 1px solid #2a2f3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .badge {
            background: #1a2a3a;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #2a4a5a;
        }

        .badge .numero {
            color: #00d4ff;
            font-weight: bold;
            font-size: 18px;
        }

        .btn-actualizar {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-actualizar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .btn-actualizar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* CONTROLES */
        .controles {
            background: #111827;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 25px;
            border: 1px solid #1f2937;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controles label {
            font-size: 14px;
            color: #9ca3af;
        }

        .controles input {
            flex: 1;
            min-width: 250px;
            background: #1a2332;
            border: 1px solid #2a3a4a;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .controles input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .controles .btn-pequeno {
            background: #1a2a3a;
            border: 1px solid #2a4a5a;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .controles .btn-pequeno:hover {
            background: #2a3a4a;
        }

        /* ESTADO DE CARGA */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a2a3a;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* TARJETAS DE PARTIDOS */
        .grid-partidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .partido-card {
            background: linear-gradient(145deg, #141b2b, #0d1220);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1f2a3a;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .partido-card:hover {
            transform: translateY(-4px);
            border-color: #2a4a6a;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .partido-card .id-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #1a2a3a;
            color: #6a8aaa;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .equipos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 10px;
        }

        .equipo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .equipo img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 50%;
            background: #0a0e17;
            padding: 5px;
            border: 2px solid #1f2a3a;
        }

        .equipo .nombre {
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: #e0e0e0;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vs {
            color: #4a6a8a;
            font-weight: bold;
            font-size: 14px;
            padding: 0 10px;
        }

        .info-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #1a2a3a;
        }

        .hora {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            font-size: 14px;
        }

        .hora .icono {
            font-size: 18px;
        }

        .btn-ver {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-ver:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .btn-ver.sin-enlace {
            background: #1a2a3a;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-ver.sin-enlace:hover {
            transform: none;
            box-shadow: none;
        }

        /* SIN DATOS */
        .sin-datos {
            text-align: center;
            padding: 60px 20px;
            color: #6a8aaa;
        }

        .sin-datos .icono-grande {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* JSON RAW */
        .json-raw {
            margin-top: 40px;
            background: #0a0e17;
            border-radius: 12px;
            border: 1px solid #1a2a3a;
            overflow: hidden;
        }

        .json-raw .toggle {
            background: #111827;
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2a3a;
            font-size: 14px;
            color: #9ca3af;
        }

        .json-raw .toggle:hover {
            background: #1a2332;
        }

        .json-raw pre {
            padding: 20px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        .json-raw pre.mostrar {
            display: block;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            .header-info {
                justify-content: center;
            }
            .grid-partidos {
                grid-template-columns: 1fr;
            }
            .controles {
                flex-direction: column;
            }
            .controles input {
                min-width: 100%;
            }
            .equipo .nombre {
                max-width: 70px;
                font-size: 12px;
            }
            .equipo img {
                width: 40px;
                height: 40px;
            }
        }

        /* ANIMACIÓN DE ENTRADA */
        .partido-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .partido-card:nth-child(1) { animation-delay: 0.05s; }
        .partido-card:nth-child(2) { animation-delay: 0.10s; }
        .partido-card:nth-child(3) { animation-delay: 0.15s; }
        .partido-card:nth-child(4) { animation-delay: 0.20s; }
        .partido-card:nth-child(5) { animation-delay: 0.25s; }
        .partido-card:nth-child(6) { animation-delay: 0.30s; }
        .partido-card:nth-child(7) { animation-delay: 0.35s; }
        .partido-card:nth-child(8) { animation-delay: 0.40s; }
        .partido-card:nth-child(9) { animation-delay: 0.45s; }
        .partido-card:nth-child(10) { animation-delay: 0.50s; }
        .partido-card:nth-child(11) { animation-delay: 0.55s; }
        .partido-card:nth-child(12) { animation-delay: 0.60s; }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #3a4a5a;
            font-size: 13px;
            padding: 20px;
            border-top: 1px solid #1a2a3a;
        }

        .footer a {
            color: #6a8aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1>⚽ Cartelera Deportiva</h1>
            <div class="header-info">
                <span class="badge">
                    📅 <span id="fechaActual">-</span>
                </span>
                <span class="badge">
                    🏟️ <span class="numero" id="totalPartidos">0</span> partidos
                </span>
                <button class="btn-actualizar" id="btnActualizar" onclick="cargarDatos()">
                    🔄 Actualizar
                </button>
            </div>
        </header>

        <!-- CONTROLES -->
        <div class="controles">
            <label for="urlWorker">🌐 URL del Worker:</label>
            <input type="url" id="urlWorker" 
                   placeholder="https://tu-worker.workers.dev/"
                   value="https://tu-worker.workers.dev/">
            <button class="btn-pequeno" onclick="cargarDatos()">📥 Cargar</button>
            <button class="btn-pequeno" onclick="usarEjemplo()">📋 Ejemplo</button>
            <button class="btn-pequeno" onclick="toggleJSON()">📄 Ver JSON</button>
        </div>

        <!-- CONTENEDOR DE PARTIDOS -->
        <div id="contenedorPartidos">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando cartelera...</p>
            </div>
        </div>

        <!-- JSON RAW -->
        <div class="json-raw" id="jsonRaw">
            <div class="toggle" onclick="toggleJSON()">
                <span>📄 Datos en JSON</span>
                <span id="toggleIcon">▶</span>
            </div>
            <pre id="jsonContent"></pre>
        </div>

        <footer class="footer">
            Datos obtenidos de <a href="https://www.thekotb.com/" target="_blank">thekotb.com</a> · 
            Actualizado automáticamente cada 60 segundos
        </footer>

    </div>

    <script>
        // ========================================
        // CONFIGURACIÓN
        // ========================================
        let datosActuales = null;
        let intervaloAuto = null;

        // ========================================
        // FUNCIÓN PRINCIPAL - CARGAR DATOS
        // ========================================
        async function cargarDatos() {
            const btn = document.getElementById('btnActualizar');
            const contenedor = document.getElementById('contenedorPartidos');
            const urlWorker = document.getElementById('urlWorker').value.trim();

            if (!urlWorker) {
                alert('Por favor, ingresa la URL de tu Worker');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Cargando...';

            // Mostrar loading
            contenedor.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Obteniendo datos de la cartelera...</p>
                </div>
            `;

            try {
                // Hacer la petición al Worker
                const response = await fetch(urlWorker, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.mensaje || 'Error desconocido');
                }

                datosActuales = data;
                renderizarPartidos(data);
                actualizarStats(data);
                mostrarJSON(data);

            } catch (error) {
                console.error('Error:', error);
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">❌</div>
                        <h2>Error al cargar los datos</h2>
                        <p style="margin-top:10px;color:#6a8aaa;">${error.message}</p>
                        <p style="margin-top:5px;font-size:13px;color:#4a5a6a;">
                            Verifica que la URL del Worker sea correcta y esté funcionando.
                        </p>
                        <button class="btn-actualizar" style="margin-top:20px;" onclick="cargarDatos()">
                            🔄 Reintentar
                        </button>
                    </div>
                `;
            }

            btn.disabled = false;
            btn.textContent = '🔄 Actualizar';
        }

        // ========================================
        // RENDERIZAR PARTIDOS
        // ========================================
        function renderizarPartidos(data) {
            const contenedor = document.getElementById('contenedorPartidos');
            const partidos = data.cartelera || [];

            if (partidos.length === 0) {
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">🏟️</div>
                        <h2>No hay partidos disponibles</h2>
                        <p style="color:#6a8aaa;">No se encontraron eventos en la cartelera actual.</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="grid-partidos">';

            partidos.forEach((partido, index) => {
                const tieneEnlace = partido.urlServidor && partido.urlServidor !== 'null';
                const logoLocal = partido.logoLocal || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%231a2a3a" width="100" height="100"/%3E%3Ctext x="50" y="55" text-anchor="middle" fill="%234a6a8a" font-size="30" font-family="Arial"%3E⚽%3C/text%3E%3C/svg%3E';
                const logoVisita = partido.logoVisita || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%231a2a3a" width="100" height="100"/%3E%3Ctext x="50" y="55" text-anchor="middle" fill="%234a6a8a" font-size="30" font-family="Arial"%3E⚽%3C/text%3E%3C/svg%3E';

                html += `
                    <div class="partido-card" style="animation-delay: ${index * 0.05}s">
                        <span class="id-badge">#${partido.id || index + 1}</span>
                        
                        <div class="equipos">
                            <div class="equipo">
                                <img src="${logoLocal}" alt="${partido.equipoLocal}" 
                                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%231a2a3a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%234a6a8a%22 font-size=%2230%22 font-family=%22Arial%22%3E⚽%3C/text%3E%3C/svg%3E'">
                                <span class="nombre">${partido.equipoLocal}</span>
                            </div>
                            
                            <div class="vs">VS</div>
                            
                            <div class="equipo">
                                <img src="${logoVisita}" alt="${partido.equipoVisita}"
                                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%231a2a3a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%234a6a8a%22 font-size=%2230%22 font-family=%22Arial%22%3E⚽%3C/text%3E%3C/svg%3E'">
                                <span class="nombre">${partido.equipoVisita}</span>
                            </div>
                        </div>

                        <div class="info-partido">
                            <div class="hora">
                                <span class="icono">🕐</span>
                                ${partido.hora || 'Horario por confirmar'}
                            </div>
                            ${tieneEnlace 
                                ? `<a href="${partido.urlServidor}" target="_blank" class="btn-ver">▶ Ver partido</a>`
                                : `<span class="btn-ver sin-enlace">🔒 Sin enlace</span>`
                            }
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            contenedor.innerHTML = html;
        }

        // ========================================
        // ACTUALIZAR ESTADÍSTICAS
        // ========================================
        function actualizarStats(data) {
            const total = data.cartelera?.length || 0;
            document.getElementById('totalPartidos').textContent = total;

            const fecha = new Date(data.metadata?.fechaExtraccion || Date.now());
            document.getElementById('fechaActual').textContent = 
                fecha.toLocaleString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
        }

        // ========================================
        // MOSTRAR JSON
        // ========================================
        function mostrarJSON(data) {
            const pre = document.getElementById('jsonContent');
            pre.textContent = JSON.stringify(data, null, 2);
        }

        function toggleJSON() {
            const pre = document.getElementById('jsonContent');
            const icon = document.getElementById('toggleIcon');
            if (pre.classList.contains('mostrar')) {
                pre.classList.remove('mostrar');
                icon.textContent = '▶';
            } else {
                pre.classList.add('mostrar');
                icon.textContent = '▼';
            }
        }

        // ========================================
        // EJEMPLO RÁPIDO
        // ========================================
        function usarEjemplo() {
            document.getElementById('urlWorker').value = 'https://tu-worker.workers.dev/?url=https://www.thekotb.com/';
            cargarDatos();
        }

        // ========================================
        // AUTO-ACTUALIZACIÓN CADA 60 SEGUNDOS
        // ========================================
        function iniciarAutoActualizacion() {
            if (intervaloAuto) clearInterval(intervaloAuto);
            intervaloAuto = setInterval(() => {
                const url = document.getElementById('urlWorker').value.trim();
                if (url) {
                    cargarDatos();
                }
            }, 60000);
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar URL guardada en localStorage
            const urlGuardada = localStorage.getItem('workerUrl');
            if (urlGuardada) {
                document.getElementById('urlWorker').value = urlGuardada;
            }

            // Guardar URL cuando cambie
            document.getElementById('urlWorker').addEventListener('change', function() {
                localStorage.setItem('workerUrl', this.value);
            });

            // Cargar datos iniciales
            cargarDatos();
            iniciarAutoActualizacion();
        });
    </script>

</body>
</html>
