<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Deportiva En Vivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1f2e, #0d1117);
            border-radius: 16px;
            padding: 25px 35px;
            margin-bottom: 25px;
            border: 1px solid #2a2f3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge {
            background: #1a2a3a;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #2a4a5a;
        }

        .badge .numero {
            color: #00d4ff;
            font-weight: bold;
            font-size: 18px;
        }

        .btn-actualizar {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-actualizar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }

        .btn-actualizar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* CONTROLES */
        .controles {
            background: #111827;
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            border: 1px solid #1f2937;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controles label {
            font-size: 14px;
            color: #9ca3af;
        }

        .controles select,
        .controles input {
            background: #1a2332;
            border: 1px solid #2a3a4a;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .controles select:focus,
        .controles input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .controles .btn-pequeno {
            background: #1a2a3a;
            border: 1px solid #2a4a5a;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .controles .btn-pequeno:hover {
            background: #2a3a4a;
        }

        /* ESTADO DE CARGA */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #1a2a3a;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* GRID DE PARTIDOS */
        .grid-partidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .partido-card {
            background: linear-gradient(145deg, #141b2b, #0d1220);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1f2a3a;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .partido-card:hover {
            transform: translateY(-4px);
            border-color: #2a4a6a;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .partido-card .id-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #1a2a3a;
            color: #6a8aaa;
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 12px;
        }

        .fuente-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid #00d4ff;
        }

        .equipos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 10px;
        }

        .equipo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .equipo img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 50%;
            background: #0a0e17;
            padding: 4px;
            border: 2px solid #1f2a3a;
        }

        .equipo .nombre {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: #e0e0e0;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vs {
            color: #4a6a8a;
            font-weight: bold;
            font-size: 13px;
            padding: 0 8px;
        }

        .info-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #1a2a3a;
        }

        .hora {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #9ca3af;
            font-size: 13px;
        }

        .btn-ver {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: white;
            padding: 7px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-ver:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .btn-ver.sin-enlace {
            background: #1a2a3a;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .sin-datos {
            text-align: center;
            padding: 60px 20px;
            color: #6a8aaa;
        }

        .sin-datos .icono-grande {
            font-size: 56px;
            margin-bottom: 15px;
        }

        /* JSON VISOR */
        .json-raw {
            margin-top: 40px;
            background: #0a0e17;
            border-radius: 12px;
            border: 1px solid #1a2a3a;
            overflow: hidden;
        }

        .json-raw .toggle {
            background: #111827;
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #9ca3af;
        }

        .json-raw pre {
            padding: 20px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            background: #06090f;
            color: #a7f3d0;
        }

        .json-raw pre.mostrar {
            display: block;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #3a4a5a;
            font-size: 13px;
            padding: 20px;
            border-top: 1px solid #1a2a3a;
        }

        .footer a {
            color: #6a8aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1>⚽ Cartelera Deportiva</h1>
            <div class="header-info">
                <span class="badge">📅 <span id="fechaActual">-</span></span>
                <span class="badge">🏟️ <span class="numero" id="totalPartidos">0</span> partidos</span>
                <button class="btn-actualizar" id="btnActualizar" onclick="cargarDatos()">🔄 Actualizar</button>
            </div>
        </header>

        <!-- CONTROLES DE CONFIGURACIÓN -->
        <div class="controles">
            <label for="dataSource">🌐 Fuente de Datos:</label>
            <select id="dataSource" onchange="cambiarFuente()">
                <option value="pelotaalibre">Pelota Libre</option>
                <option value="thekotb">The KOTB</option>
                <option value="worker">Cloudflare Worker</option>
            </select>
            <input type="url" id="urlWorker" placeholder="https://tu-worker.workers.dev/" value="https://tu-worker.workers.dev/" style="display:none;">
            <button class="btn-pequeno" onclick="cargarDatos()">📥 Cargar</button>
            <button class="btn-pequeno" onclick="toggleJSON()">📄 Ver JSON</button>
        </div>

        <!-- CONTENEDOR DE PARTIDOS -->
        <div id="contenedorPartidos">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando cartelera de partidos...</p>
            </div>
        </div>

        <!-- VISOR JSON -->
        <div class="json-raw">
            <div class="toggle" onclick="toggleJSON()">
                <span>📄 Ver estructura JSON recibida</span>
                <span id="toggleIcon">▶</span>
            </div>
            <pre id="jsonContent"></pre>
        </div>

        <footer class="footer">
            Datos consolidados de múltiples fuentes · Auto-actualización activa
        </footer>

    </div>

    <script>
        const SVG_FALLBACK = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%231a2a3a" width="100" height="100"/%3E%3Ctext x="50" y="55" text-anchor="middle" font-size="40" fill="%236a8aaa"%3E⚽%3C/text%3E%3C/svg%3E';

        // ========================================
        // CARGA Y PROCESAMIENTO AUTOMÁTICO
        // ========================================
        async function cargarDatos() {
            const btn = document.getElementById('btnActualizar');
            const contenedor = document.getElementById('contenedorPartidos');
            const dataSource = document.getElementById('dataSource').value;

            btn.disabled = true;
            btn.textContent = '⏳ Cargando...';
            contenedor.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Obteniendo todos los partidos de la cartelera...</p>
                </div>
            `;

            try {
                let data = null;

                // Seleccionar fuente de datos
                if (dataSource === 'pelotaalibre') {
                    data = await obtenerDatosPelotaLibre();
                } else if (dataSource === 'thekotb') {
                    data = await obtenerDatosDirectosScraped();
                } else if (dataSource === 'worker') {
                    const urlWorker = document.getElementById('urlWorker').value.trim();
                    if (urlWorker && !urlWorker.includes('tu-worker.workers.dev')) {
                        const response = await fetch(urlWorker, { 
                            method: 'GET', 
                            headers: { 'Accept': 'application/json' } 
                        });
                        if (response.ok) {
                            data = await response.json();
                        }
                    }
                }

                // Fallback: Si no hay datos, intentar scraper directo
                if (!data || !data.cartelera || data.cartelera.length === 0) {
                    data = await obtenerDatosDirectosScraped();
                }

                renderizarPartidos(data);
                actualizarStats(data);
                mostrarJSON(data);

            } catch (error) {
                console.error('Error al cargar datos:', error);
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">❌</div>
                        <h2>Error al procesar la cartelera</h2>
                        <p style="margin-top:8px;">${error.message}</p>
                        <button class="btn-actualizar" style="margin-top:20px;" onclick="cargarDatos()">🔄 Reintentar</button>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Actualizar';
            }
        }

        // ========================================
        // SCRAPER DE PELOTA LIBRE
        // ========================================
        async function obtenerDatosPelotaLibre() {
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://pelotaalibre.la/inicio.php');
            const res = await fetch(proxyUrl);
            const htmlText = await res.text();

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const partidos = [];

            // Buscar elementos que contengan información de partidos
            const elementos = doc.querySelectorAll(
                '[class*="partido"], [class*="match"], [class*="game"], [class*="event"], ' +
                '[class*="card"], tr, .item, [data-match], [data-game]'
            );

            elementos.forEach((el, idx) => {
                const texto = el.textContent || '';
                // Buscar patrones de VS o equipos
                if (texto.match(/\b[a-záéíóúñ\s]+\s+(?:vs?|vs\.|\svs\s|contra)\s+[a-záéíóúñ\s]+/i)) {
                    const imgs = el.querySelectorAll('img');
                    const link = el.querySelector('a[href]');

                    // Intentar extraer nombres de equipos
                    const partes = texto.split(/\s+(?:vs?|vs\.|\svs\s|contra)\s+/i);
                    let local = partes[0]?.trim().substring(0, 30) || 'Equipo Local';
                    let visita = partes[1]?.trim().substring(0, 30) || 'Equipo Visita';

                    if (local && visita) {
                        partidos.push({
                            id: idx + 1,
                            equipoLocal: local,
                            equipoVisita: visita,
                            logoLocal: imgs[0]?.src || SVG_FALLBACK,
                            logoVisita: imgs[1]?.src || SVG_FALLBACK,
                            hora: 'En vivo / Hoy',
                            urlServidor: link?.href || null,
                            fuente: 'Pelota Libre'
                        });
                    }
                }
            });

            return {
                metadata: { 
                    fechaExtraccion: new Date().toISOString(),
                    fuente: 'pelotaalibre.la'
                },
                cartelera: partidos.slice(0, 50)
            };
        }

        // ========================================
        // SCRAPER DE THEKOTB (Respaldo)
        // ========================================
        async function obtenerDatosDirectosScraped() {
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.thekotb.com/');
            const res = await fetch(proxyUrl);
            const htmlText = await res.text();

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const partidos = [];

            const filas = doc.querySelectorAll('tr, .match-item, .event, .card, a[href*="server"]');

            filas.forEach((el, idx) => {
                const texto = el.textContent || '';
                if (texto.includes('VS') || texto.includes('vs') || texto.includes('-')) {
                    const imgs = el.querySelectorAll('img');
                    const link = el.querySelector('a') || (el.tagName === 'A' ? el : null);

                    let local = 'Equipo Local';
                    let visita = 'Equipo Visita';

                    const partes = texto.split(/VS|vs|-/);
                    if (partes.length >= 2) {
                        local = partes[0].trim().replace(/\s+/g, ' ').slice(-20) || local;
                        visita = partes[1].trim().replace(/\s+/g, ' ').slice(0, 20) || visita;
                    }

                    partidos.push({
                        id: idx + 1,
                        equipoLocal: local,
                        equipoVisita: visita,
                        logoLocal: imgs[0]?.src || SVG_FALLBACK,
                        logoVisita: imgs[1]?.src || SVG_FALLBACK,
                        hora: 'En vivo / Hoy',
                        urlServidor: link?.href || null,
                        fuente: 'The KOTB'
                    });
                }
            });

            return {
                metadata: { 
                    fechaExtraccion: new Date().toISOString(),
                    fuente: 'thekotb.com'
                },
                cartelera: partidos
            };
        }

        // ========================================
        // RENDERIZADO COMPLETO
        // ========================================
        function renderizarPartidos(data) {
            const contenedor = document.getElementById('contenedorPartidos');
            const partidos = data.cartelera || [];

            if (partidos.length === 0) {
                contenedor.innerHTML = `
                    <div class="sin-datos">
                        <div class="icono-grande">🏟️</div>
                        <h2>No se encontraron partidos</h2>
                        <p>No hay eventos disponibles en este momento.</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="grid-partidos">';

            partidos.forEach((partido, index) => {
                const tieneEnlace = partido.urlServidor && partido.urlServidor !== 'null';
                const logoLocal = partido.logoLocal || SVG_FALLBACK;
                const logoVisita = partido.logoVisita || SVG_FALLBACK;
                const delay = Math.min(index * 0.02, 0.8);

                html += `
                    <div class="partido-card" style="animation-delay: ${delay}s">
                        <span class="id-badge">#${partido.id || index + 1}</span>
                        <span class="fuente-badge">${partido.fuente || 'No especificada'}</span>
                        
                        <div class="equipos">
                            <div class="equipo">
                                <img src="${logoLocal}" alt="${partido.equipoLocal}" onerror="this.src='${SVG_FALLBACK}'">
                                <span class="nombre" title="${partido.equipoLocal}">${partido.equipoLocal}</span>
                            </div>
                            
                            <div class="vs">VS</div>
                            
                            <div class="equipo">
                                <img src="${logoVisita}" alt="${partido.equipoVisita}" onerror="this.src='${SVG_FALLBACK}'">
                                <span class="nombre" title="${partido.equipoVisita}">${partido.equipoVisita}</span>
                            </div>
                        </div>

                        <div class="info-partido">
                            <div class="hora">
                                <span>🕐</span>
                                <span>${partido.hora || 'Por confirmar'}</span>
                            </div>
                            ${tieneEnlace 
                                ? `<a href="${partido.urlServidor}" target="_blank" class="btn-ver">▶ Ver partido</a>`
                                : `<span class="btn-ver sin-enlace">🔒 Sin enlace</span>`
                            }
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            contenedor.innerHTML = html;
        }

        // ========================================
        // ESTADÍSTICAS Y MANTENIMIENTO
        // ========================================
        function actualizarStats(data) {
            const total = data.cartelera?.length || 0;
            document.getElementById('totalPartidos').textContent = total;

            const fecha = new Date(data.metadata?.fechaExtraccion || Date.now());
            document.getElementById('fechaActual').textContent = fecha.toLocaleString('es-ES', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function mostrarJSON(data) {
            document.getElementById('jsonContent').textContent = JSON.stringify(data, null, 2);
        }

        function toggleJSON() {
            const pre = document.getElementById('jsonContent');
            const icon = document.getElementById('toggleIcon');
            if (pre.classList.contains('mostrar')) {
                pre.classList.remove('mostrar');
                icon.textContent = '▶';
            } else {
                pre.classList.add('mostrar');
                icon.textContent = '▼';
            }
        }

        function cambiarFuente() {
            const fuente = document.getElementById('dataSource').value;
            localStorage.setItem('dataSource', fuente);
            cargarDatos();
        }

        // Al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const dataSourceGuardada = localStorage.getItem('dataSource') || 'pelotaalibre';
            document.getElementById('dataSource').value = dataSourceGuardada;

            // Carga automática inicial
            cargarDatos();

            // Refresco automático cada 60 segundos
            setInterval(() => {
                cargarDatos();
            }, 60000);
        });
    </script>
</body>
</html>
