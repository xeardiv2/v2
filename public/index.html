<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Partidos XLSX</title>
    <!-- SheetJS CDN para procesamiento de Excel en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #22c55e;
            --accent-hover: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 25px;
        }

        /* Subida de archivos */
        .upload-container {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            transition: border-color 0.3s ease;
        }

        .upload-container:hover {
            border-color: var(--accent-color);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .custom-file-upload:hover {
            background-color: var(--accent-hover);
        }

        /* Grilla de Partidos */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tournament-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .teams-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35%;
            text-align: center;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .score-container {
            text-align: center;
            width: 30%;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .status {
            font-size: 0.75rem;
            color: #ef4444;
            font-weight: bold;
            text-transform: uppercase;
        }

        .stream-link {
            display: block;
            text-align: center;
            background-color: #334155;
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .stream-link:hover {
            background-color: #475569;
        }

        /* Visor de JSON */
        .json-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .json-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        pre {
            background-color: #090d16;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            max-height: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Reorganizador de Datos Deportivo</h1>

    <!-- 1. Sección para subir el archivo XLSX -->
    <div class="upload-container">
        <label for="excelFile" class="custom-file-upload">
            📁 Seleccionar Archivo Excel (.xlsx)
        </label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <p id="fileNameDisplay" style="margin-top: 10px; color: var(--text-secondary); font-size: 0.9rem;"></p>
    </div>

    <!-- 2. Renderizado dinámico HTML de los Partidos -->
    <div id="matchesContainer" class="matches-grid"></div>

    <!-- 3. Exportación/Visor de JSON debajo -->
    <div class="json-section" id="jsonSection" style="display: none;">
        <div class="json-header">
            <h3>Estructura JSON Generada</h3>
        </div>
        <pre id="jsonOutput"></pre>
    </div>
</div>

<script>
    document.getElementById('excelFile').addEventListener('change', handleFile, false);

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('fileNameDisplay').textContent = `Archivo cargado: ${file.name}`;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            // Tomamos la primera hoja del Excel
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // Convertimos la hoja a un Array de Objetos JSON
            const rawData = XLSX.utils.sheet_to_json(worksheet);

            // Mapeamos los datos raw a una estructura más limpia
            const cleanMatches = rawData.map(row => ({
                id: row.web_scraper_order || '',
                competicion: row.data5 || 'Competición N/A',
                equipo_local: row.name || 'Local',
                equipo_visitante: row.name2 || 'Visitante',
                marcador: row.data || '0-0',
                estado: row.data2 || '',
                minuto: row.data3 || '',
                escudo_local: row.image || '',
                escudo_visitante: row.image2 || '',
                link_transmision: row.web_scraper_start_url || '#'
            }));

            // Renderizar la vista HTML y el JSON
            renderHTML(cleanMatches);
            renderJSON(cleanMatches);
        };
        reader.readAsArrayBuffer(file);
    }

    function renderHTML(matches) {
        const container = document.getElementById('matchesContainer');
        container.innerHTML = '';

        matches.forEach(match => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div>
                    <div class="tournament-badge">${match.competicion}</div>
                    <div class="teams-container">
                        <div class="team">
                            <img class="team-logo" src="${match.escudo_local}" alt="${match.equipo_local}" onerror="this.src='https://via.placeholder.com/50'">
                            <span class="team-name">${match.equipo_local}</span>
                        </div>
                        <div class="score-container">
                            <div class="score">${match.marcador}</div>
                            <div class="status">${match.estado}</div>
                        </div>
                        <div class="team">
                            <img class="team-logo" src="${match.escudo_visitante}" alt="${match.equipo_visitante}" onerror="this.src='https://via.placeholder.com/50'">
                            <span class="team-name">${match.equipo_visitante}</span>
                        </div>
                    </div>
                </div>
                <a href="${match.link_transmision}" target="_blank" class="stream-link">▶ Ver Transmisión</a>
            `;
            container.appendChild(card);
        });
    }

    function renderJSON(matches) {
        const jsonSection = document.getElementById('jsonSection');
        const jsonOutput = document.getElementById('jsonOutput');
        
        jsonOutput.textContent = JSON.stringify(matches, null, 2);
        jsonSection.style.display = 'block';
    }
</script>

</body>
</html>
